aid: deci-ai
name: Deci AI
description: Deci AI was a deep-learning development company (founded 2019, Tel Aviv) whose platform helped teams
  build, optimize, and deploy computer-vision and NLP models in production. Its stack combined the AutoNAC neural-architecture-search
  engine, the Infery inference runtime, and the open-source SuperGradients PyTorch training library — the home of
  the YOLO-NAS object-detection architecture. Deci was acquired by NVIDIA in 2024; deci.ai now redirects to NVIDIA
  and there is no live standalone hosted API or developer console. This API Evangelist profile tracks the company's
  surviving first-party open-source software surface (SuperGradients and DataGradients on PyPI, published from the
  Deci-AI GitHub org).
